<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2주차 실습 2</title>
</head>
<body>
  <!--
  실습 2 · 응용

  문제: 페이지 안에서 이동하는 목차를 만드세요. 위에 링크 목록(ul + a)을 두고, 아래에 그 목록이 가리키는 h2 세 개를 두어, 링크를 누르면 해당 위치로 내려가게 하세요.
  힌트: 링크는 href="#이름", 목적지는 id="이름" 입니다. 두 이름이 정확히 같아야 합니다.
  꼭 들어가야 하는 것: href="#  id="  <ul>  <h2
  -->
  <!-- 여기에 HTML을 작성하세요 -->
  <h1> 자기 소개</h1>
<ul>
  <li><a href="#intro"> 자기소개</a></li>
  <li><a href="#job"> 하는 일</a></li>
  <li><a href="#play"> 취미</a></li>
</ul>

<h2> id="intro">자기소개</h2>
<p>현재 한신대학교 다니는 박상현 입니다.</p>
 
<h2 id="job">하는 일</h2>
<p>웹프로그래밍 수업을 듣고 있습니다.</p>
 
<h2 id="play">취미</h2>
<p> 현재 게임을 즐겨하고 운전도 좋아합니다.</p>
</body>
</html>
